<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yoshida 辛积分三体</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <canvas
      id="trailCanvas"
      style="position: fixed; top: 0; left: 0; pointer-events: none; z-index: 1"
    ></canvas>
    <div class="scale-bar-container" id="scaleBarContainer">
      <div class="scale-bar">
        <div class="scale-bar-ruler">
          <div class="scale-bar-line" id="scaleBarLine"></div>
        </div>
        <div class="scale-zoom" id="scaleZoomIndicator">1.00x</div>
      </div>
    </div>
    <div class="panel-container right" id="panelContainer">
      <button class="toggle-btn" id="togglePanel">⚙</button>
      <div class="panel-base control-panel" id="controlPanel">
        <div class="btn-group">
          <button id="start">开始</button>
          <button id="stop">暂停</button>
          <button id="reset">重置</button>
          <button id="restore">恢复</button>
        </div>
        <div class="bodies-container">
          <div class="bodies-header">
            <div class="label-col"></div>
            <div class="body-col">天体1</div>
            <div class="body-col">天体2</div>
            <div class="body-col">天体3</div>
          </div>
          <div class="bodies-row">
            <div class="label-col">质量</div>
            <div class="body-col">
              <input type="number" id="m1" value="1" step="0.1" />
            </div>
            <div class="body-col">
              <input type="number" id="m2" value="1" step="0.1" />
            </div>
            <div class="body-col">
              <input type="number" id="m3" value="1" step="0.1" />
            </div>
          </div>
          <div class="bodies-row">
            <div class="label-col">速度X</div>
            <div class="body-col">
              <input type="number" id="v1x" value="0.3471168881" step="0.01" />
            </div>
            <div class="body-col">
              <input type="number" id="v2x" value="0.3471168881" step="0.01" />
            </div>
            <div class="body-col">
              <input type="number" id="v3x" value="-0.6942337762" step="0.01" />
            </div>
          </div>
          <div class="bodies-row">
            <div class="label-col">速度Y</div>
            <div class="body-col">
              <input type="number" id="v1y" value="0.5327249454" step="0.01" />
            </div>
            <div class="body-col">
              <input type="number" id="v2y" value="0.5327249454" step="0.01" />
            </div>
            <div class="body-col">
              <input type="number" id="v3y" value="-1.0654498908" step="0.01" />
            </div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="input-group">
          <label>引力常数:</label>
          <input type="number" id="gravity" value="1" step="1" />
          <button class="feature-btn active" id="btnMinDist">引力软化</button>
        </div>
        <div class="divider"></div>
        <div class="input-group">
          <label>运行速度:</label>
          <input
            type="number"
            id="speedInput"
            value="1"
            step="1"
            min="1"
            max="50"
          />
          <input
            type="range"
            id="speedRange"
            value="1"
            step="1"
            min="1"
            max="50"
          />
          <span id="speedVal">1x</span>
        </div>
        <div class="divider"></div>
        <div class="input-group">
          <label>轨迹长度:</label>
          <input
            type="number"
            id="trailLength"
            value="1000"
            step="10"
            min="10"
            max="5000"
          />
          <input
            type="range"
            id="trailLengthRange"
            value="1000"
            step="10"
            min="10"
            max="5000"
          />
          <span id="trailLengthVal">1000</span>
        </div>
        <div class="feature-buttons">
          <button class="feature-btn active" id="btnTrail">显示轨迹</button>
          <button class="feature-btn" id="btnCom">物理真实</button>
          <button class="feature-btn" id="btnCollision">碰撞检测</button>
          <button class="feature-btn active" id="btnAutoZoom">自动缩放</button>
        </div>
        <div class="divider"></div>
        <div class="body-controls">
          <h4>引力牢笼系统</h4>
          <div class="feature-buttons">
            <button class="feature-btn active" id="btnCageEnabled">
              启用引力牢笼
            </button>
            <button class="feature-btn" id="btnCageShowBoundaries">
              显示边界
            </button>
          </div>
          <div class="input-group">
            <label>边界半径:</label>
            <input
              type="number"
              id="cageBoundary"
              value="1600"
              step="50"
              min="400"
              max="4000"
            />
            <input
              type="range"
              id="cageBoundaryRange"
              value="1600"
              step="50"
              min="400"
              max="4000"
            />
          </div>
          <div class="input-group">
            <label>预警半径:</label>
            <input
              type="number"
              id="cageWarning"
              value="700"
              step="50"
              min="200"
              max="3000"
            />
            <input
              type="range"
              id="cageWarningRange"
              value="700"
              step="50"
              min="200"
              max="3000"
            />
          </div>
          <button class="reset-panel-btn" id="resetGravityCage">
            重置参数
          </button>
        </div>
        <div class="divider"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
